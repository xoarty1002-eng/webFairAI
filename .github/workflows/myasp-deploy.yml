name: Deploy to myasp.net

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ASPNETCORE_ENVIRONMENT: Production
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Restore backend dependencies
        run: dotnet restore

      - name: Build backend
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --configuration Release --no-build --nologo

      - name: Install frontend dependencies
        run: npm install --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Publish API
        run: dotnet publish FairAI.Api/FairAI.Api.csproj -c Release -o ./publish

      - name: Copy frontend to wwwroot
        run: |
          mkdir -p ./publish/wwwroot
          cp -r ./frontend/out/* ./publish/wwwroot/ 2>/dev/null || true

      - name: Trigger myasp.net deployment
        if: ${{ secrets.MYASP_DEPLOY_HOOK_URL != '' }}
        env:
          DEPLOY_HOOK_URL: ${{ secrets.MYASP_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error --location \
            --request POST "$DEPLOY_HOOK_URL"

      - name: Skip deployment (missing secret)
        if: ${{ secrets.MYASP_DEPLOY_HOOK_URL == '' }}
        run: |
          echo "MYASP_DEPLOY_HOOK_URL is missing."
          echo "Set it in GitHub: Settings -> Secrets and variables -> Actions"
