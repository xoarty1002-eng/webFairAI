- name: Setup .NET
  uses: actions/setup-dotnet@v4
  with:
    dotnet-version: 9.0.x

- name: Restore dependencies
  run: dotnet restore webFairAI.slnx

- name: Build and Publish
  run: dotnet publish FairAI.Api/FairAI.Api.csproj -c Release -o ./publish

- name: Trigger myasp.net Deployment
  if: secrets.MYASP_DEPLOY_HOOK_URL != ''
  run: |
    curl -X POST "${{ secrets.MYASP_DEPLOY_HOOK_URL }}" \
      -H "Content-Type: application/json" \
      -d '{"ref":"${{ github.ref }}"}'
  
- name: Skip Deployment (Missing Secret)
  if: secrets.MYASP_DEPLOY_HOOK_URL == ''
  run: |
    echo "⚠️  MYASP_DEPLOY_HOOK_URL secret is not configured."
    echo "To enable deployment to myasp.net, add the deploy hook URL as a repository secret."