- name: Setup .NET
  uses: actions/setup-dotnet@v4
  with:
    dotnet-version: 9.0.x

- name: Restore dependencies
  run: dotnet restore webFairAI.slnx

- name: Build and Publish
  run: dotnet publish FairAI.Api/FairAI.Api.csproj -c Release -o ./publish

- name: Deploy to Target Branch
  uses: JamesIves/github-pages-deploy-action@v4
  with:
    folder: ./publish
    branch: xoarty1002-001 # Matches your hosting sync requirement