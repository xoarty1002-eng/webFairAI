name: Build and Deploy ASP.NET Core

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      ASPNETCORE_ENVIRONMENT: Production

    steps:
      - name: Validate required secrets
        shell: powershell
        run: |
          $required = @(
            'WEBSITE_NAME',
            'SERVER_COMPUTER_NAME',
            'SERVER_USERNAME',
            'SERVER_PASSWORD'
          )

          foreach ($name in $required) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "Missing required GitHub repository secret: $name. Add it under Settings -> Secrets and variables -> Actions."
            }
          }

          Write-Host "Deployment secrets validated."
        env:
          WEBSITE_NAME: ${{ secrets.WEBSITE_NAME }}
          SERVER_COMPUTER_NAME: ${{ secrets.SERVER_COMPUTER_NAME }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --configuration Release --no-build

      - name: Install frontend dependencies
        run: npm install --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Publish application
        run: dotnet publish --configuration Release --no-build --output ./release

      - name: Copy frontend to wwwroot
        shell: bash
        run: |
          mkdir -p ./release/wwwroot
          cp -r ./frontend/out/* ./release/wwwroot/ 2>/dev/null || true

      - name: Deploy application
        shell: powershell
        run: |
          $msdeploy = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"

          $siteName = "${{ secrets.WEBSITE_NAME }}"
          $computer = "${{ secrets.SERVER_COMPUTER_NAME }}"
          $user = "${{ secrets.SERVER_USERNAME }}"
          $password = "${{ secrets.SERVER_PASSWORD }}"

          if (-not (Test-Path $msdeploy)) {
            throw "msdeploy.exe was not found at $msdeploy. Install Web Deploy on the runner or use a supported hosting/deploy path."
          }

          if ([string]::IsNullOrWhiteSpace($siteName) -or [string]::IsNullOrWhiteSpace($computer) -or [string]::IsNullOrWhiteSpace($user) -or [string]::IsNullOrWhiteSpace($password)) {
            throw "One or more required deployment secrets are missing: WEBSITE_NAME, SERVER_COMPUTER_NAME, SERVER_USERNAME, SERVER_PASSWORD. Update the repository secrets in GitHub."
          }

          & $msdeploy `
            -verb:sync `
            -source:contentPath="$(Get-Location)\release" `
            -dest:contentPath="$siteName",ComputerName="$computer",UserName="$user",Password="$password",AuthType="Basic" `
            -allowUntrusted `
            -enableRule:AppOffline `
            -enableRule:DoNotDeleteRule

      - name: Deployment summary
        if: always()
        shell: powershell
        run: |
          Write-Host "Repository secret checklist:"
          Write-Host "- WEBSITE_NAME"
          Write-Host "- SERVER_COMPUTER_NAME"
          Write-Host "- SERVER_USERNAME"
          Write-Host "- SERVER_PASSWORD"
          Write-Host "If any value is blank, add it at Settings -> Secrets and variables -> Actions."
